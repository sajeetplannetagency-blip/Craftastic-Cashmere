<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Craftastic Cashmere</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;


const PRODUCTS = [
  {
    id: "p1",
    name: "Sozni Embroidered Pashmina",
    desc: "Hand-embroidered indigo pashmina with traditional paisley border",
    price: 8500,
    pattern: "linear-gradient(135deg, #1c2f52 0%, #2a4470 45%, #1c2f52 100%)",
    accent: "#c9a24b",
  },
  {
    id: "p2",
    name: "Kani Weave Shawl",
    desc: "Multi-colour Kani weave, wool blend, hand-finished fringe",
    price: 6200,
    pattern: "linear-gradient(135deg, #7a2e2e 0%, #a3453f 45%, #7a2e2e 100%)",
    accent: "#e8c77a",
  },
  {
    id: "p3",
    name: "Classic Nehru Jacket",
    desc: "Cashmere-wool Nehru jacket, hand-finished buttons",
    price: 4500,
    pattern: "linear-gradient(135deg, #2f2f2f 0%, #4a4a4a 45%, #2f2f2f 100%)",
    accent: "#c9a24b",
  },
  {
    id: "p4",
    name: "Ari Embroidered Firan",
    desc: "Traditional firan with dense chain-stitch embroidery",
    price: 12000,
    pattern: "linear-gradient(135deg, #1c2f52 0%, #7a2e2e 100%)",
    accent: "#e8c77a",
  },
  {
    id: "p5",
    name: "Plain Pashmina Stole",
    desc: "100% pure pashmina, undyed natural tone",
    price: 5200,
    pattern: "linear-gradient(135deg, #d8cbb0 0%, #c9b990 45%, #d8cbb0 100%)",
    accent: "#7a2e2e",
  },
  {
    id: "p6",
    name: "Papier-Mâché Jewel Box",
    desc: "Hand-painted papier-mâché box with gold leaf detail",
    price: 1800,
    pattern: "linear-gradient(135deg, #7a2e2e 0%, #1c2f52 100%)",
    accent: "#c9a24b",
  },
];

function formatINR(n) {
  return "₹" + n.toLocaleString("en-IN");
}

function App() {
  const [cart, setCart] = useState({});
  const [cartOpen, setCartOpen] = useState(false);
  const [toast, setToast] = useState("");
  const [checkoutStep, setCheckoutStep] = useState(0);

  function addToCart(product) {
    setCart((prev) => ({
      ...prev,
      [product.id]: (prev[product.id] || 0) + 1,
    }));
    setToast(`${product.name} added to cart`);
    setTimeout(() => setToast(""), 1800);
  }

  function changeQty(id, delta) {
    setCart((prev) => {
      const next = { ...prev };
      next[id] = (next[id] || 0) + delta;
      if (next[id] <= 0) delete next[id];
      return next;
    });
  }

  const cartItems = Object.entries(cart).map(([id, qty]) => ({
    ...PRODUCTS.find((p) => p.id === id),
    qty,
  }));
  const cartCount = cartItems.reduce((s, i) => s + i.qty, 0);
  const cartTotal = cartItems.reduce((s, i) => s + i.qty * i.price, 0);

  return (
    <div style={styles.page}>
      {/* Header */}
      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.brand}>
            <div style={styles.brandMark}>CC</div>
            <div>
              <div style={styles.brandName}>Craftastic Cashmere</div>
              <div style={styles.brandSub}>Srinagar, Kashmir · Est. Handcrafted</div>
            </div>
          </div>
          <button
            style={styles.cartButton}
            onClick={() => setCartOpen(true)}
            aria-label="Open cart"
          >
            <CartIcon />
            <span>Cart</span>
            {cartCount > 0 && <span style={styles.cartBadge}>{cartCount}</span>}
          </button>
        </div>
      </header>

      {/* Hero */}
      <section style={styles.hero}>
        <div style={styles.heroPattern} />
        <div style={styles.heroContent}>
          <div style={styles.heroEyebrow}>Sample Demo — Not Live</div>
          <h1 style={styles.heroTitle}>
            Woven in the valley,
            <br />
            <span style={{ color: "#c9a24b" }}>ordered from anywhere.</span>
          </h1>
          <p style={styles.heroText}>
            Authentic Kashmiri pashmina, shawls &amp; handicrafts — this is a
            working preview of how your customers could browse, add to cart,
            and pay online.
          </p>
        </div>
      </section>

      {/* Products */}
      <section style={styles.productsSection}>
        <div style={styles.sectionHead}>
          <h2 style={styles.sectionTitle}>The Collection</h2>
          <div style={styles.sectionLine} />
        </div>
        <div style={styles.grid}>
          {PRODUCTS.map((p) => (
            <div style={styles.card} key={p.id}>
              <div style={{ ...styles.cardImage, background: p.pattern }}>
                <div style={{ ...styles.cardImageAccent, background: p.accent }} />
              </div>
              <div style={styles.cardBody}>
                <div style={styles.cardName}>{p.name}</div>
                <div style={styles.cardDesc}>{p.desc}</div>
                <div style={styles.cardFooter}>
                  <div style={styles.cardPrice}>{formatINR(p.price)}</div>
                  <button
                    style={styles.addButton}
                    onClick={() => addToCart(p)}
                  >
                    Add to Cart
                  </button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </section>

      <footer style={styles.footer}>
        <div>Craftastic Cashmere — Sample website for demo purposes only</div>
      </footer>

      {/* Toast */}
      {toast && <div style={styles.toast}>{toast}</div>}

      {/* Cart Drawer */}
      {cartOpen && (
        <div style={styles.overlay} onClick={() => setCartOpen(false)}>
          <div style={styles.drawer} onClick={(e) => e.stopPropagation()}>
            <div style={styles.drawerHeader}>
              <div style={styles.drawerTitle}>
                {checkoutStep === 0 ? "Your Cart" : checkoutStep === 1 ? "Checkout" : "Order Placed"}
              </div>
              <button
                style={styles.closeButton}
                onClick={() => {
                  setCartOpen(false);
                  setCheckoutStep(0);
                }}
              >
                ✕
              </button>
            </div>

            {checkoutStep === 0 && (
              <>
                <div style={styles.drawerBody}>
                  {cartItems.length === 0 && (
                    <div style={styles.emptyCart}>Your cart is empty.</div>
                  )}
                  {cartItems.map((item) => (
                    <div style={styles.cartRow} key={item.id}>
                      <div
                        style={{
                          ...styles.cartThumb,
                          background: item.pattern,
                        }}
                      />
                      <div style={{ flex: 1 }}>
                        <div style={styles.cartItemName}>{item.name}</div>
                        <div style={styles.cartItemPrice}>
                          {formatINR(item.price)}
                        </div>
                      </div>
                      <div style={styles.qtyControl}>
                        <button
                          style={styles.qtyBtn}
                          onClick={() => changeQty(item.id, -1)}
                        >
                          −
                        </button>
                        <span style={styles.qtyNum}>{item.qty}</span>
                        <button
                          style={styles.qtyBtn}
                          onClick={() => changeQty(item.id, 1)}
                        >
                          +
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
                {cartItems.length > 0 && (
                  <div style={styles.drawerFooter}>
                    <div style={styles.totalRow}>
                      <span>Total</span>
                      <span style={styles.totalAmount}>
                        {formatINR(cartTotal)}
                      </span>
                    </div>
                    <button
                      style={styles.checkoutButton}
                      onClick={() => setCheckoutStep(1)}
                    >
                      Proceed to Checkout
                    </button>
                  </div>
                )}
              </>
            )}

            {checkoutStep === 1 && (
              <div style={styles.drawerBody}>
                <div style={styles.fieldLabel}>Full Name</div>
                <input style={styles.input} placeholder="e.g. Aisha Khan" />
                <div style={styles.fieldLabel}>Phone Number</div>
                <input
                  style={styles.input}
                  placeholder="e.g. 98765 43210"
                  type="tel"
                  inputMode="numeric"
                  maxLength={10}
                />
                <div style={styles.fieldLabel}>Delivery Address</div>
                <input style={styles.input} placeholder="House no, Street, City" />
                <div style={styles.fieldLabel}>Pin Code</div>
                <input
                  style={styles.input}
                  placeholder="e.g. 190001"
                  type="tel"
                  inputMode="numeric"
                  maxLength={6}
                />

                <div style={styles.payLabel}>Choose Payment Method</div>
                <div style={styles.payOptions}>
                  <div style={styles.payChip}>UPI</div>
                  <div style={styles.payChip}>Card</div>
                  <div style={styles.payChip}>Net Banking</div>
                </div>
                <div style={styles.payNote}>
                  (Sample only — real gateway connects here once Razorpay is linked)
                </div>

                <div style={styles.totalRow}>
                  <span>Total</span>
                  <span style={styles.totalAmount}>{formatINR(cartTotal)}</span>
                </div>
                <button
                  style={styles.checkoutButton}
                  onClick={() => setCheckoutStep(2)}
                >
                  Pay {formatINR(cartTotal)}
                </button>
              </div>
            )}

            {checkoutStep === 2 && (
              <div style={styles.drawerBody}>
                <div style={styles.successWrap}>
                  <div style={styles.successCheck}>✓</div>
                  <div style={styles.successTitle}>Order Confirmed</div>
                  <div style={styles.successText}>
                    Notification sent to shop owner. Pickup will be scheduled
                    with Shiprocket automatically.
                  </div>
                  <button
                    style={styles.checkoutButton}
                    onClick={() => {
                      setCart({});
                      setCheckoutStep(0);
                      setCartOpen(false);
                    }}
                  >
                    Done
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function CartIcon() {
  return (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path
        d="M3 3h2l.4 2M7 13h10l3-7H5.4M7 13L5.4 5M7 13l-1.5 5h11"
        stroke="currentColor"
        strokeWidth="1.6"
        strokeLinecap="round"
        strokeLinejoin="round"
      />
      <circle cx="9" cy="20" r="1.4" fill="currentColor" />
      <circle cx="17" cy="20" r="1.4" fill="currentColor" />
    </svg>
  );
}
