<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Road Fighter</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #hud {
            position: absolute; top: 15px; left: 15px; color: #FFF; font-weight: bold;
            font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #controls-hint {
            position: absolute; bottom: 20px; width: 100%; text-align: center;
            color: #FFF; font-size: 14px; opacity: 0.8; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="hud">SPEED: <span id="speed">0</span> KM/H | FUEL: <span id="fuel">100</span>%</div>
    <div id="controls-hint">Drag Left / Right to Steer</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 0, -5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        const roadGeo = new THREE.PlaneGeometry(8, 200);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.z = -90;
        scene.add(road);

        const carGeo = new THREE.BoxGeometry(1.2, 0.6, 2.2);
        const carMat = new THREE.MeshLambertMaterial({ color: 0xff0000 });
        const player = new THREE.Mesh(carGeo, carMat);
        player.position.set(0, 0.3, 0);
        scene.add(player);

        let speed = 0;
        let maxSpeed = 120;
        let fuel = 100;
        let targetX = 0;

        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            targetX = ((touch.clientX / window.innerWidth) - 0.5) * 7;
        });

        let isDragging = false;
        window.addEventListener('mousedown', () => isDragging = true);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                targetX = ((e.clientX / window.innerWidth) - 0.5) * 7;
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (fuel > 0) {
                speed = Math.min(speed + 0.5, maxSpeed);
                fuel -= 0.03;

                player.position.x += (targetX - player.position.x) * 0.1;
                player.position.x = Math.max(-3.2, Math.min(3.2, player.position.x));

                document.getElementById('speed').innerText = Math.round(speed);
                document.getElementById('fuel').innerText = Math.round(fuel);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
